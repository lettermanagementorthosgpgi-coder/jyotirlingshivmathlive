
name: Jyotirling Shivmath Live Scheduler

on:
  schedule:
    # Shiv Puran preparation: 19:00 IST previous evening through 06:00 IST.
    - cron: "30 13-23 * * *"
    - cron: "0,30 0 * * *"

    # Bhagavad Gita preparation: 08:00–18:00 IST.
    - cron: "30 2-12 * * *"
    - cron: "0 3-12 * * *"

  workflow_dispatch:
    inputs:
      action:
        description: "Choose action"
        required: true
        type: choice
        options:
          - create
          - update_time
          - test_image
          - test_metadata
          - generate_seo
          - prepare_retry
          - retry_thumbnail
          - update_gita_range
        default: test_image

      programme:
        description: "Choose programme"
        required: false
        type: choice
        options:
          - shivpuran
          - bhagavadgita

      broadcast_date:
        description: "Broadcast date (YYYY-MM-DD)"
        required: false
        type: string

      actual_time:
        description: "New broadcast time (HH:MM, IST)"
        required: false
        type: string

      broadcast_id:
        description: "Existing YouTube Broadcast ID (if required)"
        required: false
        type: string

      gita_chapter:
        description: "Bhagavad Gita chapter number (1-18)"
        required: false
        type: string

      gita_verse_start:
        description: "First shloka number for today's discourse"
        required: false
        type: string

      gita_verse_end:
        description: "Last shloka number for today's discourse"
        required: false
        type: string

      source_text:
        description: "Paste today's complete meaning/discourse text (up to 20,000 characters)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: jyotirling-live-scheduler
  cancel-in-progress: false

jobs:
  schedule-live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Live Scheduler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-2.5-flash
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          ACTION: ${{ github.event_name == 'schedule' && 'prepare_retry' || inputs.action || 'test_image' }}
          PROGRAMME: ${{ inputs.programme }}
          BROADCAST_DATE: ${{ inputs.broadcast_date }}
          ACTUAL_TIME: ${{ inputs.actual_time }}
          BROADCAST_ID: ${{ inputs.broadcast_id }}
          GITA_CHAPTER: ${{ inputs.gita_chapter }}
          GITA_VERSE_START: ${{ inputs.gita_verse_start }}
          GITA_VERSE_END: ${{ inputs.gita_verse_end }}
          SOURCE_TEXT: ${{ inputs.source_text }}

          GITHUB_REPOSITORY: ${{ github.repository }}

        run: |
          python live_scheduler.py

      - name: Save test thumbnail for review
        if: success() && inputs.action == 'test_image'
        uses: actions/upload-artifact@v4
        with:
          name: thumbnail-preview-${{ inputs.programme }}-${{ github.run_number }}
          path: generated_thumbnail.jpg
          if-no-files-found: error
          retention-days: 3

      - name: Save generated SEO package for review
        if: success() && inputs.action == 'generate_seo'
        uses: actions/upload-artifact@v4
        with:
          name: generated-seo-${{ inputs.programme }}-${{ github.run_number }}
          path: |
            generated_seo.txt
            generated_seo.json
          if-no-files-found: error
          retention-days: 7
