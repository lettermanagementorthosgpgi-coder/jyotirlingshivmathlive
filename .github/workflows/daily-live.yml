
name: Jyotirling Shivmath Live Scheduler

on:
  schedule:
    # Shiv Puran: 07:00 AM IST
    - cron: "30 1 * * *"

    # Bhagavad Gita: 07:00 PM IST
    - cron: "30 13 * * *"

  workflow_dispatch:
    inputs:
      action:
        description: "Choose action"
        required: true
        type: choice
        options:
          - create
          - update_time
          - test_image
          - test_metadata
        default: create

      programme:
        description: "Choose programme"
        required: false
        type: choice
        options:
          - shivpuran
          - bhagavadgita

      broadcast_date:
        description: "Broadcast date (YYYY-MM-DD)"
        required: false
        type: string

      actual_time:
        description: "New broadcast time (HH:MM, IST)"
        required: false
        type: string

      broadcast_id:
        description: "Existing YouTube Broadcast ID (if required)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: jyotirling-live-scheduler
  cancel-in-progress: false

jobs:
  schedule-live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Live Scheduler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-2.5-flash
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          ACTION: ${{ inputs.action || 'create' }}
          PROGRAMME: ${{ inputs.programme }}
          BROADCAST_DATE: ${{ inputs.broadcast_date }}
          ACTUAL_TIME: ${{ inputs.actual_time }}
          BROADCAST_ID: ${{ inputs.broadcast_id }}

          GITHUB_REPOSITORY: ${{ github.repository }}

        run: |
          python live_scheduler.py
