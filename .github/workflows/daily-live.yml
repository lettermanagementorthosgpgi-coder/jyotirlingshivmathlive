
name: Jyotirling Shivmath Live Scheduler

on:
  workflow_dispatch:
  schedule:
    # 7:00 AM IST = 01:30 UTC
    - cron: "30 1 * * *"
    # 7:00 PM IST = 13:30 UTC
    - cron: "30 13 * * *"

permissions:
  contents: read

concurrency:
  group: jyotirling-live-scheduler
  cancel-in-progress: false

jobs:
  schedule-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check required project files
        run: |
          test -f config.json
          test -f live_scheduler.py

      - name: Run live scheduler
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python live_scheduler.py
